name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main      # ou la branche que tu utilises (ex: master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'    # adapte la version si besoin

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build     # adapte la commande (ex: npm run build, hugo, etc.)

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public          # dossier généré à publier (change si nécessaire)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
